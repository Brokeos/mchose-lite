[package]
name = "mchose-lite"
version = "0.1.0"
edition = "2024"
description = "Remplaçant léger de MCHOSE HUB (souris MCHOSE L7 Pro et K7 Ultra) en Rust"
license = "MIT"
repository = "https://github.com/Brokeos/mchose-lite"
readme = "README.md"
publish = false

[dependencies]
egui = { version = "0.34", default-features = false, features = ["default_fonts"] }
egui_software_backend = "0.0.3"
hidapi = { version = "2.6.7", default-features = false, features = ["windows-native"] }
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
embed-resource = "3"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
